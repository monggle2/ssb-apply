<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신청·면접 시스템 담당자 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>

/* Layout: 상단 탭 3개(설계·신청·접수함) + 사업 선택. 설계는 2단(목록|요약), 접수함은 목록|상세 2단. 서류 양식 같은 정돈된 업무 화면 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#eef1f0; --ink:#17221f; --muted:#5b6a66; --line:#d8dfdc; --line2:#bfc9c5;
  --accent:#0f5c55; --accent-ink:#ffffff; --accent-soft:#e1efec;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#a3322a; --bad-soft:#f9e6e4; --info:#2b5a8a; --info-soft:#e5eef8;
  --display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --sunk:#141c19; --ink:#e6eeeb; --muted:#9db0aa; --line:#2b3834; --line2:#3a4a45;
  --accent:#5fc2b4; --accent-ink:#0c1715; --accent-soft:#1d3531;
  --ok:#6fd08f; --ok-soft:#173022; --warn:#e7b85a; --warn-soft:#33280f; --bad:#f08b80; --bad-soft:#3a1c19; --info:#8fb8e6; --info-soft:#1b2a3a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --sunk:#141c19; --ink:#e6eeeb; --muted:#9db0aa; --line:#2b3834; --line2:#3a4a45;
  --accent:#5fc2b4; --accent-ink:#0c1715; --accent-soft:#1d3531;
  --ok:#6fd08f; --ok-soft:#173022; --warn:#e7b85a; --warn-soft:#33280f; --bad:#f08b80; --bad-soft:#3a1c19; --info:#8fb8e6; --info-soft:#1b2a3a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto}
.brand h1{font-size:18px}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.progpick{display:flex;align-items:center;gap:8px}
.progpick label{font-size:13px;color:var(--muted)}
select,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=url],textarea{
  background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px}
select{width:auto;max-width:100%}
.progpick select{min-width:220px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 8px}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{font-size:13.5px;padding:9px 12px;border-radius:6px;background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
main{padding:20px 0 60px}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sm{font-size:13px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sechead{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.sechead h3{font-size:16px}
.sechead .code{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px}
.field>label,.flabel{font-weight:500;font-size:14px}
.req{color:var(--bad);margin-left:3px}
.help{font-size:12.5px;color:var(--muted)}
/* designer */
.ditem{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ditem.off{background:var(--sunk)}
.ditem.off .dname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px}
.dname{font-weight:500}
.dtype{font-size:12.5px;color:var(--muted)}
.dedit{border-top:1px dashed var(--line);padding:12px;display:grid;gap:10px;background:var(--sunk);border-radius:0 0 8px 8px}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.switch input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.fgrid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 10px;align-items:center}
.fgrid .k{font-size:12.5px;color:var(--muted)}
.qtext{font-size:14px}
.anc{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.anc li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:13.5px}
.anc b{font-variant-numeric:tabular-nums}
.summary dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;margin:0}
.summary dt{color:var(--muted);font-size:13.5px}
.summary dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
/* applicant form */
.form{max-width:780px;margin:0 auto;display:grid;gap:18px}
.fsec{display:grid;gap:16px}
.fitem{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.fitem:first-of-type{border-top:0}
.fitem h4{font-size:15px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.choices{display:flex;flex-wrap:wrap;gap:6px 14px}
.choices label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.choices input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.unit{display:flex;align-items:center;gap:6px}
.unit span{font-size:13px;color:var(--muted);white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scale td{white-space:nowrap}
.scale td:first-child{white-space:normal}
.err{color:var(--bad);font-size:12.5px}
.fitem.invalid{border-left:3px solid var(--bad);padding-left:10px}
.filelist{display:flex;flex-wrap:wrap;gap:6px}
.done{text-align:center;padding:40px 20px;display:grid;gap:10px;justify-items:center}
.done .no{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
/* inbox */
.inbox{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.alist{display:grid;gap:0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;border-left:3px solid transparent;width:100%;border-top:0;border-right:0}
.arow:hover{background:var(--sunk)}
.arow[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.arow .t{font-weight:600}
.arow .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.arow .r{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.score{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv>div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv .k{background:var(--sunk);color:var(--muted);font-size:13px}
.kv .g{grid-column:1/-1;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;text-decoration:none;background:var(--surface)}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.dtabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.iq{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.iq.na{background:var(--sunk)}
.iqh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iqh .no{font-family:var(--display);font-weight:700;color:var(--accent)}
.probe{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.scorebtns{display:flex;gap:4px;flex-wrap:wrap}
.scorebtns button{min-width:40px;padding:6px 0;border:1px solid var(--line2);background:var(--surface);border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.scorebtns button.na{min-width:72px;font-weight:500;font-size:13px}
.scorebtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.areabar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13.5px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.total .score{font-size:26px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
.toast[hidden]{display:none}
@media (max-width:900px){
  .grid2,.inbox{grid-template-columns:1fr}
  .sticky{position:static}
  .kv{grid-template-columns:1fr}
  .kv .k{border-bottom:0}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .dhead{grid-template-columns:auto minmax(0,1fr);}
  .dhead .dtype{grid-column:2}
  .fgrid{grid-template-columns:1fr}
  .progpick select{min-width:0;width:100%}
  .progpick{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.linkbox{display:flex;gap:6px;align-items:center}.linkbox input{flex:1;min-width:0;font-size:13px}
.toplinks{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}.toplinks a{color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.plist{display:grid;gap:10px}.pcard{display:block;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.pcard:hover{border-color:var(--accent)}

</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand"><h1>신청·면접 시스템 · 담당자</h1><span>내부 시연·테스트용 · 실제 신청자 정보는 넣지 마세요</span></div>
    <div class="tabs" role="tablist" aria-label="화면">
      <button role="tab" id="tab-design" aria-selected="true" data-view="design">설계</button>
      <button role="tab" id="tab-inbox" aria-selected="false" data-view="inbox">접수함</button>
    </div>
    <div class="progpick">
      <label for="prog">사업</label>
      <select id="prog"></select>
    </div>
  </div>
  <div class="wrap"><div class="toplinks" id="toplinks" style="padding:0 0 10px"></div></div>
</header>
<main class="wrap">
  <div id="conn" class="notice" style="margin-bottom:14px">불러오는 중입니다.</div>
  <section class="view" id="view-design" aria-labelledby="tab-design"></section>
  <section class="view" id="view-inbox" aria-labelledby="tab-inbox" hidden></section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const SIDO=['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시','경기도','강원특별자치도','충청북도','충청남도','전북특별자치도','전라남도','경상북도','경상남도','제주특별자치도'];
const CHAN=['스마트스토어','쿠팡','자사몰','인스타그램','배달앱','오픈마켓','오프라인 매장만','아직 없음','기타'];
const YN=['예','아니오'];
/* 신청 항목 카탈로그: 보고서 2번 신청 항목 기준 */
const CATALOG=[
 {sec:'A',title:'신청자·사업자 기본',scope:'common',items:[
  {key:'biz',label:'사업자 정보',req:true,fields:[
    {k:'name',label:'상호',t:'text'},{k:'brn',label:'사업자등록번호',t:'text',ph:'000-00-00000'},{k:'ceo',label:'대표자명',t:'text'},
    {k:'btype',label:'사업자 유형',t:'select',opts:['개인 일반과세자','개인 간이과세자','법인']},{k:'open',label:'개업일',t:'date'},{k:'ind',label:'업종',t:'text',ph:'예: 한식 음식점'}]},
  {key:'contact',label:'연락처',req:true,fields:[{k:'phone',label:'전화',t:'tel',ph:'010-0000-0000'},{k:'email',label:'이메일',t:'email'}]},
  {key:'addr',label:'사업장 주소',req:true,fields:[{k:'sido',label:'시·도',t:'select',opts:SIDO},{k:'sigungu',label:'시·군·구',t:'text'},{k:'detail',label:'상세 주소',t:'text'}]},
  {key:'goods',label:'주요 취급 품목(상품·서비스)',req:true,fields:[{k:'v',label:'품목',t:'text',ph:'예: 수제 반찬, 도시락'}]},
  {key:'place',label:'사업장 형태·임차 현황',req:true,fields:[{k:'form',label:'사업장 형태',t:'select',opts:['점포','무점포','공방·작업실','공유 오피스','기타']},{k:'lease',label:'임차 현황',t:'select',opts:['자가','월세','전세','공유 오피스','기타']}]},
  {key:'birth',label:'대표자 생년월일',req:true,help:'주민등록번호 뒷자리 첫 번호까지 7자리',fields:[{k:'v',label:'생년월일',t:'text',ph:'900101-1',pattern:'^\\d{6}-?\\d$'}]},
  {key:'career',label:'대표자 주요 경력 및 창업 동기',req:true,fields:[{k:'v',label:'내용',t:'textarea',max:1000}]},
  {key:'mode',label:'사업 운영 방식',req:true,fields:[{k:'v',label:'운영 방식',t:'radio',opts:['오프라인만','온라인 병행','온라인만']}]}
 ]},
 {sec:'B',title:'매출 현황',scope:'common',items:[
  {key:'sales',label:'사업장 자금수지표(월 매출)',req:true,help:'부가세 포함 금액, 원 단위',fields:[
    {k:'avgLast',label:'직전 연도 월평균',t:'number',unit:'원'},{k:'m6',label:'6개월 전 월 매출',t:'number',unit:'원'},{k:'m3',label:'3개월 전 월 매출',t:'number',unit:'원'},
    {k:'now',label:'지난달 월 매출',t:'number',unit:'원'},{k:'avg3',label:'최근 3개월 월평균',t:'number',unit:'원'}]},
  {key:'annual',label:'직전 연도 연매출 + 부가세 과세표준증명원',req:true,fields:[{k:'amt',label:'직전 연도 연매출',t:'number',unit:'원'},{k:'file',label:'부가세 과세표준증명원',t:'file'}]},
  {key:'cost',label:'월 지출·기타 수입 현황',req:true,help:'최근 3개월 평균, 원 단위. 없으면 0',fields:[
    {k:'material',label:'재료비',t:'number',unit:'원'},{k:'ad',label:'광고비',t:'number',unit:'원'},{k:'fee',label:'플랫폼 수수료',t:'number',unit:'원'},{k:'ship',label:'배송비',t:'number',unit:'원'},
    {k:'rent',label:'임대료',t:'number',unit:'원'},{k:'labor',label:'인건비',t:'number',unit:'원'},{k:'loanpay',label:'대출 상환 원리금',t:'number',unit:'원'},{k:'other',label:'기타 수입',t:'number',unit:'원'}]}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const won=n=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString('ko-KR');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- 사업 설정 적용 ---------- */
function catalogFor(mod){return CATALOG.filter(s=>s.scope==='common'||s.scope===mod)}
function effItems(p){
  const ov=(p&&p.items)||{};
  return catalogFor(p?p.module:'online').map(s=>({...s,items:s.items.map(it=>{
    const o=ov[it.key]||{};
    return {...it,on:o.on!==false,req:o.req??it.req,label:o.label||it.label,help:o.help??it.help??'',
      fields:it.fields.map(f=>{const fo=(o.fields||{})[f.k]||{};return {...f,label:fo.label||f.label,opts:fo.opts||f.opts}})};
  })}));
}
function bankFor(mod){return QBANK[mod==='loan'?'loan':'online']}
function effQs(p){
  const ov=(p&&p.qs)||{};
  return bankFor(p?p.module:'online').map(q=>{const o=ov[q.id]||{};
    return {...q,on:o.on!==false,q:o.q||q.q,probe:o.probe||q.probe,look:o.look||q.look,anc:o.anc||q.anc,area:o.area||q.area}});
}
function cur(){return S.programs[S.pid]||null}
function progName(p){return p?(p.name||'이름 없는 사업'):''}

/* ---------- 연결 ---------- */
function setConn(m,k){const c=$('#conn');if(!m){c.hidden=true;return}c.hidden=false;c.className='notice'+(k?' '+k:'');c.textContent=m}

/* ---------- 상단 ---------- */
function confirmLeave(){toast('설계 화면에 저장하지 않은 변경이 있습니다. 먼저 저장하거나 되돌려 주세요.');return false}

const S={ready:false,canEdit:true,programs:{},apps:{},appsPid:null,appsLoading:false,pid:null,view:'design',
  draft:null,draftDirty:false,openItem:null,openQ:null,
  sel:null,dtab:'info',iv:null,ivDirty:false,elig:null,filter:{status:'',q:''},
  info:{me:'',sheetUrl:'',folderUrl:'',formUrl:''}};
const $=s=>document.querySelector(s);
/* 서버 함수 호출 */
function run(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e instanceof Error?e:new Error(String(e&&e.message||e))))[fn](...args)})}
function pubLink(id){const u=S.info.formUrl||'';return u?(u.replace(/[?#].*$/,'').replace(/\x2F?$/,'/'))+'?p='+encodeURIComponent(id):''}
function setPrograms(list){S.programs={};(list||[]).forEach(p=>S.programs[p.id]=p)}
async function boot(){
  bindTop();render();
  try{
    const r=await run('adminInit');
    S.info={me:r.me,sheetUrl:r.sheetUrl,folderUrl:r.folderUrl,formUrl:r.formUrl||''};
    setPrograms(r.programs);S.ready=true;
    const keep=lsGet('ssb-pid');S.pid=(keep&&S.programs[keep])?keep:(Object.keys(S.programs).sort()[0]||null);
    setConn('');render();
    if(S.pid)loadApps();
  }catch(e){setConn('불러오지 못했습니다. '+e.message,'bad')}
}
async function loadApps(){
  const pid=S.pid;if(!pid||!S.programs[pid]){S.apps={};if(S.view==='inbox')renderInbox();return}
  S.appsLoading=true;if(S.view==='inbox')renderInbox();
  try{const list=await run('adminListApps',pid);if(S.pid!==pid)return;S.apps={};list.forEach(a=>S.apps[a.id]=a);S.appsPid=pid}
  catch(e){toast('접수 목록을 불러오지 못했습니다. '+e.message)}
  S.appsLoading=false;if(S.view==='inbox')renderInbox();
}
function go(v){S.view=v;render();if(v==='inbox'&&!S.ivDirty)loadApps()}
function bindTop(){
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{if(S.ivDirty&&b.dataset.view!=='inbox'){toast('저장하지 않은 면접 점수가 있습니다. 먼저 저장해 주세요.');return}go(b.dataset.view)}));
  $('#prog').addEventListener('change',e=>{
    if(e.target.value==='__new'){if(S.draftDirty&&!confirmLeave()){e.target.value=S.pid;return}newProgram();return}
    if((S.draftDirty&&!confirmLeave())||(S.ivDirty&&(toast('저장하지 않은 면접 점수가 있습니다. 먼저 저장해 주세요.'),true))){e.target.value=S.pid;return}
    S.pid=e.target.value;lsSet('ssb-pid',S.pid);S.draft=null;S.draftDirty=false;S.sel=null;S.apps={};render();loadApps()});
}
function renderTop(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===S.view)));
  const sel=$('#prog');const ids=Object.keys(S.programs).sort((a,b)=>(S.programs[a].name||'').localeCompare(S.programs[b].name||''));
  const nd=(S.draft&&S.draft.isNew)?`<option value="${esc(S.draft.id)}" selected>(새 사업 · 저장 전)</option>`:'';
  sel.innerHTML=nd+((ids.length||nd)?'':'<option value="">저장된 사업 없음</option>')+ids.map(id=>`<option value="${esc(id)}"${id===S.pid?' selected':''}>${esc(progName(S.programs[id]))} · ${S.programs[id].module==='loan'?'여신':'여신 외'}${S.programs[id].open?'':' (접수 닫힘)'}</option>`).join('')+'<option value="__new">+ 새 사업 만들기</option>';
  $('#toplinks').innerHTML=S.ready?`<span class="muted">${esc(S.info.me)}</span>${S.info.sheetUrl?`<a href="${esc(S.info.sheetUrl)}" target="_blank" rel="noopener">스프레드시트</a>`:''}${S.info.folderUrl?`<a href="${esc(S.info.folderUrl)}" target="_blank" rel="noopener">서류 폴더</a>`:''}`:'';
}
function render(){
  renderTop();
  ['design','inbox'].forEach(v=>$('#view-'+v).hidden=v!==S.view);
  if(S.view==='design')renderDesign();else renderInbox();
}

async function saveDesign(){
  if(saving)return;const d=S.draft;
  if(!d.name.trim()){toast('사업 이름을 입력해 주세요.');$('#d-name').focus();return}
  saving=true;const b=$('#d-save');if(b)b.disabled=true;
  const body=clone(d);delete body.isNew;delete body.updatedAt;delete body.updatedBy;
  try{const list=await run('adminSaveProgram',body);setPrograms(list);const isNew=d.isNew;S.draftDirty=false;S.draft=null;S.pid=d.id;lsSet('ssb-pid',d.id);toast('설계를 저장했습니다.');if(isNew)loadApps()}
  catch(e){toast('저장하지 못했습니다. '+e.message);if(b)b.disabled=false}
  saving=false;render();
}

function newProgram(){
  const id='p'+Date.now().toString(36);
  S.pid=id;S.draft={id,name:'',module:'online',start:'',end:'',notice:'',code:'',open:false,demo:true,items:{},qs:{},isNew:true};S.draftDirty=true;go('design');
}
function draft(){if(!S.draft){const p=cur();S.draft=p?clone(p):null}return S.draft}

function typeSummary(it){return it.fields.map(f=>TYPE_NAME[f.t]).filter((v,i,a)=>a.indexOf(v)===i).join(' + ')}

   <div class="dhead">
    <label class="switch" title="사용"><input type="checkbox" data-act="item-on" ${it.on?'checked':''}${ro?' disabled':''}><span class="sr">사용</span></label>
    <div><div class="dname">${esc(it.label)}</div><div class="dtype">${esc(typeSummary(it))}${it.help?' · '+esc(it.help):''}</div></div>

     <span></span><div><button class="btn sm" data-act="item-reset"${ro?' disabled':''}>기본 문구로 되돌리기</button></div>

function qGroupsOnline(qs,ro){return AREAS.map(a=>{const g=qs.filter(q=>q.area===a);
  return `<div class="stack" style="gap:8px"><h4 style="font-size:14px">${esc(a)} <span class="pill acc">25점</span> <span class="muted sm">${g.filter(q=>q.on).length}/${g.length}개 사용</span></h4>${g.map(q=>dQ(q,ro,true)).join('')||'<p class="muted sm">이 영역에 질문이 없습니다.</p>'}</div>`}).join('')}
function qGroupsLoan(qs,ro){const gs=[...new Set(qs.map(q=>q.group))];return gs.map(g=>{const list=qs.filter(q=>q.group===g);
  const pts=list.filter(q=>!q.bonus).reduce((a,q)=>a+q.points,0);
  return `<div class="stack" style="gap:8px"><h4 style="font-size:14px">${esc(g)} ${pts?`<span class="pill acc">${pts}점</span>`:'<span class="pill">총점 미포함</span>'}</h4>${list.map(q=>dQ(q,ro,false)).join('')}</div>`}).join('')}
function dQ(q,ro,online){

    <div><div class="dname"><b style="color:var(--accent);font-family:var(--display)">${esc(no)}</b> ${esc(q.crit)}</div><div class="dtype">${esc(q.q.length>70?q.q.slice(0,70)+'…':q.q)}</div></div>
    <span class="row" style="gap:4px">${q.fact?'<span class="pill info">사실확인</span>':'<span class="pill">정성평가</span>'}${q.points?`<span class="pill acc">${q.points}점</span>`:''}${q.bonus?'<span class="pill warn">가점 후보</span>':''}</span>
    <button class="btn ghost sm" data-act="q-open" aria-expanded="${open}">${open?'닫기':'수정'}</button>
   </div>
   ${open?`<div class="dedit fgrid">
     ${online?`<span class="k">심사영역</span><select data-act="q-area"${ro?' disabled':''}>${AREAS.map(a=>`<option${a===q.area?' selected':''}>${esc(a)}</option>`).join('')}</select>`:''}
     <span class="k">질문</span><textarea data-act="q-q" rows="3"${ro?' disabled':''}>${esc(q.q)}</textarea>
     <span class="k">되묻기(한 줄에 하나)</span><textarea data-act="q-probe" rows="${Math.max(2,q.probe.length)}"${ro?' disabled':''}>${esc(q.probe.join('\n'))}</textarea>
     <span class="k">살펴볼 점(한 줄에 하나)</span><textarea data-act="q-look" rows="${Math.max(2,q.look.length)}"${ro?' disabled':''}>${esc(q.look.join('\n'))}</textarea>
     ${q.anc.map((a,i)=>`<span class="k">${5-i}점 기준</span><input type="text" data-act="q-anc" data-i="${i}" value="${esc(a)}"${ro?' disabled':''}>`).join('')}
     <span></span><div><button class="btn sm" data-act="q-reset"${ro?' disabled':''}>기본 문구로 되돌리기</button></div>
   </div>`:''}
  </div>`;
}
function bindDesign(ro){
  const el=$('#view-design');const d=S.draft;
  const setv=(k,v)=>{d[k]=v;markDirty()};
  el.querySelector('#d-name').oninput=e=>setv('name',e.target.value);
  el.querySelector('#d-start').onchange=e=>setv('start',e.target.value);
  el.querySelector('#d-end').onchange=e=>setv('end',e.target.value);
  el.querySelector('#d-notice').oninput=e=>setv('notice',e.target.value);
  el.querySelectorAll('input[name=d-mod]').forEach(r=>r.onchange=e=>{d.module=e.target.value;S.openQ=null;markDirty();renderDesign()});
  if(ro)el.querySelectorAll('#d-name,#d-start,#d-end,#d-notice,#d-code,#d-open,#d-demo,input[name=d-mod]').forEach(x=>x.disabled=true);
  el.querySelector('#d-save').onclick=saveDesign;
  el.querySelector('#d-revert').onclick=()=>{if(d.isNew){delete S.programs[d.id];S.pid=Object.keys(S.programs)[0]||null}S.draft=null;S.draftDirty=false;renderTop();renderDesign()};
  el.querySelector('#d-code').oninput=e=>setv('code',e.target.value.trim());
  el.querySelector('#d-open').onchange=e=>setv('open',e.target.checked);
  el.querySelector('#d-demo').onchange=e=>setv('demo',e.target.checked);
  const pv=el.querySelector('#d-preview');if(pv)pv.onclick=()=>window.open(pubLink(d.id),'_blank','noopener');
  const cp=el.querySelector('#d-copy');if(cp)cp.onclick=()=>{const i=$('#d-link');i.select();try{navigator.clipboard.writeText(i.value).then(()=>toast('링크를 복사했습니다.'),()=>{document.execCommand('copy');toast('링크를 복사했습니다.')})}catch(e){document.execCommand('copy');toast('링크를 복사했습니다.')}};
  el.querySelector('#d-formurl-save').onclick=async()=>{const v=$('#d-formurl').value.trim();
    if(v&&!/^https:\x2F\x2F/.test(v)){toast('https:// 로 시작하는 주소를 넣어 주세요.');return}
    try{await run('adminSetFormUrl',v);S.info.formUrl=v;toast('신청 페이지 주소를 저장했습니다.');renderDesign()}catch(e){toast(e.message)}};
  if(el._bound)return;el._bound=true;
  const io=k=>{const d=S.draft;d.items=d.items||{};return d.items[k]=d.items[k]||{}};
  const qo=k=>{const d=S.draft;d.qs=d.qs||{};return d.qs[k]=d.qs[k]||{}};
  el.addEventListener('change',e=>{if(!S.draft||!S.canEdit)return;const a=e.target.dataset.act;if(!a)return;
    const ik=e.target.closest('[data-item]')?.dataset.item,qk=e.target.closest('[data-q]')?.dataset.q;
    if(a==='item-on'){io(ik).on=e.target.checked;markDirty();renderDesign()}
    else if(a==='item-req'){io(ik).req=e.target.checked;markDirty();renderDesign()}
    else if(a==='q-on'){qo(qk).on=e.target.checked;markDirty();renderDesign()}
    else if(a==='q-area'){qo(qk).area=e.target.value;markDirty();renderDesign()}
    else if(a==='f-opts'){const o=io(ik);o.fields=o.fields||{};o.fields[e.target.dataset.f]={...(o.fields[e.target.dataset.f]||{}),opts:e.target.value.split(',').map(s=>s.trim()).filter(Boolean)};markDirty()}
  });
  el.addEventListener('input',e=>{if(!S.draft||!S.canEdit)return;const d=S.draft;const a=e.target.dataset.act;if(!a)return;
    const ik=e.target.closest('[data-item]')?.dataset.item,qk=e.target.closest('[data-q]')?.dataset.q,v=e.target.value;
    if(a==='item-label'){io(ik).label=v;markDirty()}
    else if(a==='item-help'){io(ik).help=v;markDirty()}
    else if(a==='f-label'){const o=io(ik);o.fields=o.fields||{};o.fields[e.target.dataset.f]={...(o.fields[e.target.dataset.f]||{}),label:v};markDirty()}
    else if(a==='q-q'){qo(qk).q=v;markDirty()}
    else if(a==='q-probe'){qo(qk).probe=v.split('\n').map(s=>s.trim()).filter(Boolean);markDirty()}
    else if(a==='q-look'){qo(qk).look=v.split('\n').map(s=>s.trim()).filter(Boolean);markDirty()}
    else if(a==='q-anc'){const q=effQs(d).find(x=>x.id===qk);const o=qo(qk);const arr=(o.anc||q.anc).slice();arr[+e.target.dataset.i]=v;o.anc=arr;markDirty()}
  });
  el.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName!=='BUTTON')return;const a=b.dataset.act;
    const ik=b.closest('[data-item]')?.dataset.item,qk=b.closest('[data-q]')?.dataset.q;
    if(a==='item-open'){S.openItem=S.openItem===ik?null:ik;renderDesign()}
    else if(a==='q-open'){S.openQ=S.openQ===qk?null:qk;renderDesign()}
    else if(!S.canEdit)return;
    else if(a==='item-reset'){const o=io(ik);delete o.label;delete o.help;delete o.fields;markDirty();renderDesign()}
    else if(a==='q-reset'){const o=qo(qk);['q','probe','look','anc','area'].forEach(k=>delete o[k]);markDirty();renderDesign()}
  });
}
function appsFor(){const p=cur();return Object.values(S.apps).filter(a=>!p||a.pid===p.id).sort((a,b)=>b.submittedAt-a.submittedAt)}
function calcScore(app,p){
  const qs=effQs(p||{module:app.module}).filter(q=>q.on);const sc=(app.interview||{}).scores||{};
  if((p?p.module:app.module)==='loan'){
    let tot=0,max=0,done=0,bonus=0;const rows=[];
    qs.forEach(q=>{const s=sc[q.id];if(q.bonus){if(typeof s==='number')bonus+=s;return}
      if(s==='na')return;max+=q.points;if(typeof s==='number'){tot+=q.points*s/5;done++}});
    const groups=[...new Set(qs.filter(q=>!q.bonus).map(q=>q.group))].map(g=>{const l=qs.filter(q=>q.group===g&&!q.bonus);
      const mx=l.filter(q=>sc[q.id]!=='na').reduce((a,q)=>a+q.points,0),v=l.reduce((a,q)=>a+(typeof sc[q.id]==='number'?q.points*sc[q.id]/5:0),0);
      return {name:g,max:mx,val:v,done:l.filter(q=>typeof sc[q.id]==='number').length,n:l.length}});
    const n=qs.filter(q=>!q.bonus).length;
    return {kind:'loan',total:Math.round(tot*10)/10,max,groups,done,n,bonus,started:done>0};
  }
  const areas=AREAS.map(a=>{const l=qs.filter(q=>q.area===a);const ans=l.filter(q=>typeof sc[q.id]==='number');
    const na=l.filter(q=>sc[q.id]==='na').length;const val=ans.length?ans.reduce((x,q)=>x+sc[q.id],0)/(ans.length*5)*25:null;
    return {name:a,val:val==null?null:Math.round(val*10)/10,done:ans.length,na,n:l.length,max:25}});
  const done=areas.reduce((a,x)=>a+x.done+x.na,0),n=qs.length;
  const total=areas.every(a=>a.val==null)?null:Math.round(areas.reduce((a,x)=>a+(x.val||0),0)*10)/10;
  return {kind:'online',total,max:100,areas,done,n,started:areas.some(a=>a.done)};
}

       ${['','접수','적격','보완 요청','부적격'].map(k=>`<button class="btn sm${f.status===k?' primary':''}" data-st="${k}">${k||'전체'} <span class="score">${k?cnt(k):all.length}</span></button>`).join('')}
     </div>
     <div class="row"><input type="text" id="i-q" placeholder="상호·대표자·접수번호 검색" value="${esc(f.q)}" style="width:220px" aria-label="검색">
       <button class="btn" id="i-reload">새로고침</button><a class="btn" href="${esc(S.info.sheetUrl)}" target="_blank" rel="noopener">시트 열기</a></div>
   </div>
   <div class="inbox">
     <div class="panel" style="padding:0;overflow:hidden">
       ${list.length?`<div class="alist">${list.map(a=>{const sc=calcScore(a,p);const st=a.status||'접수';
         return `<button class="arow" data-id="${esc(a.id)}" aria-current="${a.id===S.sel}"><span class="t">${esc(a.bizName||'(상호 없음)')}</span>
           <span class="r"><span class="pill ${STATUS[st]}">${esc(st)}</span></span>
           <span class="s">${esc(a.id)} · ${esc(a.ceo||'')} · ${new Date(a.submittedAt).toLocaleDateString('ko-KR')}</span>
           <span class="s">${sc.started?`면접 <b class="score">${sc.total}</b>/${sc.max}`:'면접 전'}</span></button>`}).join('')}</div>`
         :`<div class="empty">${all.length?'조건에 맞는 신청이 없습니다.':(S.appsLoading?'불러오는 중입니다.':'아직 접수된 신청이 없습니다. 공개 신청 링크에서 하나 제출해 보세요.')}</div>`}
     </div>
     <div>${S.sel?detail(S.apps[S.sel],p):'<div class="panel empty">왼쪽 목록에서 신청을 고르세요.</div>'}</div>
   </div></div>`;
  bindInbox();
}
function fmtVal(f,v){
  if(v==null||v==='')return '<span class="muted">—</span>';
  switch(f.t){
    case 'number':return esc(won(v))+(f.unit?' '+esc(f.unit):'');
    case 'checks':case 'consent':return Array.isArray(v)&&v.length?v.map(x=>`<span class="pill" style="margin:1px 2px">${esc(x)}</span>`).join(''):'<span class="muted">—</span>';
    case 'file':return Array.isArray(v)&&v.length?`<div class="filelist">${v.map(x=>x.url?`<a class="pill info" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:`<span class="pill warn">${esc(x.name)} · 미저장</span>`).join(' ')}</div>`:'<span class="muted">—</span>';
    case 'scale4':return f.stmts.map((s,i)=>`${esc(s)}: <b>${esc(v[i]??'—')}</b>`).join('<br>');
    case 'rows':{const rs=(v||[]).filter(r=>r&&Object.values(r).some(x=>String(x).trim()));if(!rs.length)return '<span class="muted">—</span>';
      return `<div class="tbl"><table><thead><tr>${f.cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${f.cols.map(c=>`<td${c.t==='number'?' class="num"':''}>${esc(c.t==='number'?won(r[c.k]):(r[c.k]||''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    case 'url':return `<a href="${esc(/^https?:\x2F\x2F/.test(v)?v:'https://'+v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
    case 'textarea':return `<span style="white-space:pre-line">${esc(v)}</span>`;
  }
  return esc(v);
}
function detail(a,p){
  const secs=effItems(p);const ans=a.answers||{};const st=a.status||'접수';
  const tabs=[['info','신청 내용'],['files','첨부 파일'],['elig','적/부 판정'],['iv','면접 기록지']];
  let body='';
  if(S.dtab==='info'){
    body=`<div class="kv">${secs.map(s=>{const its=s.items.filter(it=>it.on||ans[it.key]);if(!its.length)return '';
      return `<div class="g">${esc(s.sec.length===1?s.sec+'. ':'')}${esc(s.title)}</div>`+its.map(it=>it.fields.filter(f=>f.t!=='file').map(f=>`<div class="k">${esc(it.label)}${it.fields.length>1?' · '+esc(f.label):''}</div><div>${fmtVal(f,(ans[it.key]||{})[f.k])}</div>`).join('')).join('')}).join('')}</div>`;
  }else if(S.dtab==='files'){
    const fl=secs.flatMap(s=>s.items.flatMap(it=>it.fields.filter(f=>f.t==='file').map(f=>({it,f}))));
    body=`<div class="kv">${fl.map(({it,f})=>`<div class="k">${esc(it.label)}${it.fields.length>1?' · '+esc(f.label):''}</div><div>${fmtVal(f,(ans[it.key]||{})[f.k])}</div>`).join('')}</div>
      <p class="help">파일을 누르면 구글 드라이브에서 열립니다.${a.folder?` <a href="${esc(a.folder)}" target="_blank" rel="noopener">이 신청의 서류 폴더 열기</a>`:''}</p>`;
  }else if(S.dtab==='elig'){
    const e=S.elig||{status:st,kind:(a.elig||{}).kind||'',note:(a.elig||{}).note||''};S.elig=e;
    body=`<div class="stack">
      <div class="field"><span class="flabel">판정</span><div class="choices" role="radiogroup" aria-label="판정">
        ${['접수','적격','보완 요청','부적격'].map(k=>`<label><input type="radio" name="e-st" value="${k}"${e.status===k?' checked':''}>${k==='접수'?'미판정':k}</label>`).join('')}</div></div>
      ${e.status==='부적격'||e.status==='보완 요청'?`<div class="field"><span class="flabel">사유 구분</span><div class="choices" role="radiogroup" aria-label="사유 구분">
        ${['자격 미달','서류 미비'].map(k=>`<label><input type="radio" name="e-kind" value="${k}"${e.kind===k?' checked':''}>${k}</label>`).join('')}</div>
        <span class="help">자격 미달은 바로 부적격, 서류 미비는 보완 요청 1회 후 미제출 시 부적격</span></div>`:''}
      <div class="field"><label for="e-note">메모</label><textarea id="e-note" rows="3" placeholder="예: 통장 사본이 다른 문서로 첨부됨, 11/30까지 보완 요청">${esc(e.note)}</textarea></div>
      <div class="row"><button class="btn primary" id="e-save">판정 저장</button><span class="help">현재: <span class="pill ${STATUS[st]}">${esc(st)}</span></span></div></div>`;
  }else{
    if(!S.iv||S.iv.id!==a.id)S.iv={id:a.id,...clone(a.interview||{scores:{},notes:{},interviewer:'',date:''})};
    const iv=S.iv;const qs=effQs(p).filter(q=>q.on);const sc=calcScore({...a,interview:iv},p);
    const groups=p.module==='loan'?[...new Set(qs.map(q=>q.group))].map(g=>({name:g,qs:qs.filter(q=>q.group===g)})):AREAS.map(x=>({name:x,qs:qs.filter(q=>q.area===x)}));
    body=`<div class="stack">
      <div class="panel stack" style="background:var(--sunk)">
        ${sc.kind==='online'?sc.areas.map(x=>`<div class="areabar"><span>${esc(x.name)} <span class="muted sm">${x.done}/${x.n-x.na}문항${x.na?` · 해당 없음 ${x.na}`:''}</span></span><b class="score">${x.val==null?'—':x.val} <span class="muted sm">/ 25</span></b><div class="meter"><i style="width:${(x.val||0)/25*100}%"></i></div></div>`).join('')
          :sc.groups.map(x=>`<div class="areabar"><span>${esc(x.name)} <span class="muted sm">${x.done}/${x.n}항목</span></span><b class="score">${Math.round(x.val*10)/10} <span class="muted sm">/ ${x.max}</span></b><div class="meter"><i style="width:${x.max?x.val/x.max*100:0}%"></i></div></div>`).join('')}
        <div class="total"><span>면접 점수 <span class="muted sm">${sc.done}/${sc.n} 채점</span></span><span class="score">${sc.total??'—'} <span class="muted sm">/ ${sc.max}</span></span></div>
        ${sc.kind==='loan'?`<span class="help">가점 후보 ${sc.bonus}점(총점에 넣지 않음). 항목 점수 = 배점 × 받은 점수 ÷ 5</span>`:'<span class="help">영역 점수 = 받은 점수 합 ÷ (채점한 문항 수 × 5) × 25. 해당 없음은 계산에서 뺍니다.</span>'}
      </div>
      <div class="subgrid"><div class="field"><label for="v-who">면접관</label><input type="text" id="v-who" value="${esc(iv.interviewer)}"></div>
        <div class="field"><label for="v-date">면접일</label><input type="date" id="v-date" value="${esc(iv.date)}"></div></div>
      ${groups.map(g=>`<h4 style="font-size:14px;margin-top:6px">${esc(g.name)}</h4>${g.qs.map(q=>ivQ(q,iv,a,p)).join('')}`).join('')}
      <div class="row" style="position:sticky;bottom:0;background:var(--bg);padding:10px 0"><button class="btn primary" id="v-save"${S.ivDirty?'':' disabled'}>면접 기록 저장</button><span class="help">${S.ivDirty?'저장하지 않은 점수가 있습니다':'저장됨'}</span></div>
    </div>`;
  }
  return `<div class="panel">
   <div class="row" style="justify-content:space-between;align-items:flex-start">
     <div><h3 style="font-size:18px">${esc(a.bizName||'(상호 없음)')}</h3><p class="muted sm" style="margin:2px 0 0">${esc(a.id)} · ${esc(a.ceo||'')} · ${new Date(a.submittedAt).toLocaleString('ko-KR')}</p></div>
     <span class="pill ${STATUS[st]}">${esc(st)}</span></div>
   <div class="dtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-dt="${k}" aria-selected="${S.dtab===k}">${l}</button>`).join('')}</div>
   ${body}</div>`;
}
function ivQ(q,iv,a,p){
  const s=iv.scores[q.id];const link=linkVals(q,a,p);
  return `<div class="iq${s==='na'?' na':''}" data-q="${q.id}">
    <div class="iqh"><span class="no">${esc(q.no?q.no:q.id)}</span><span class="sm muted">${esc(q.crit)}</span>${q.fact?'<span class="pill info">사실확인</span>':''}${q.points?`<span class="pill acc">${q.points}점</span>`:''}${q.bonus?'<span class="pill warn">가점 후보</span>':''}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${link?`<div class="notice" style="font-size:13px"><b>신청서 내용</b> ${link}</div>`:''}
    ${q.probe.length?`<ul class="probe">${q.probe.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <details><summary>살펴볼 점 · 점수 기준</summary><p class="sm" style="margin:6px 0">${esc(q.look.join(' · '))}</p><ol class="anc">${q.anc.map((t,i)=>`<li><b>${5-i}점</b><span>${esc(t)}</span></li>`).join('')}</ol></details>
    <div class="scorebtns" role="group" aria-label="${esc(q.no||q.id)} 점수">${[5,4,3,2,1,0].map(n=>`<button type="button" data-sc="${n}" aria-pressed="${s===n}">${n}</button>`).join('')}<button type="button" class="na" data-sc="na" aria-pressed="${s==='na'}">해당 없음</button></div>
    <textarea data-note="1" rows="2" placeholder="답변 메모" aria-label="${esc(q.no||q.id)} 메모">${esc((iv.notes||{})[q.id]||'')}</textarea>
  </div>`;
}
const QLINK={Q04:[['m_chan','main'],['m_tools','v']],Q09:[['m_prod','rows']],Q11:[['m_chan','main']],Q16:[['m_staff','who'],['m_staff','hours']],Q17:[['m_staff','hours'],['m_edu','slots']],Q01:[['reason','pick']],Q03:[['reason','text']],
  L02:[['sales','avg3'],['annual','amt']],L03:[['l_fund','amount'],['l_fund','use']],L10:[['cost','loanpay'],['place','lease']],L11:[['l_repay','how']],L05:[['career','v']]};
function linkVals(q,a,p){const l=QLINK[q.id];if(!l)return '';const secs=effItems(p);const ans=a.answers||{};
  const out=l.map(([ik,fk])=>{const it=secs.flatMap(s=>s.items).find(i=>i.key===ik);if(!it)return '';const f=it.fields.find(x=>x.k===fk);const v=(ans[ik]||{})[fk];
    if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
    let t=f.t==='number'?won(v)+(f.unit||''):f.t==='rows'?v.filter(r=>r&&r.name).map(r=>`${r.name} ${won(r.price)}원`).join(', '):Array.isArray(v)?v.join(', '):String(v);
    if(t.length>80)t=t.slice(0,80)+'…';return `${esc(f.label)}: ${esc(t)}`}).filter(Boolean);
  return out.join(' · ');}
function bindInbox(){
  const el=$('#view-inbox');
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.filter.status=b.dataset.st;renderInbox()});
  const q=$('#i-q');if(q)q.oninput=e=>{S.filter.q=e.target.value;clearTimeout(q._t);q._t=setTimeout(()=>{renderInbox();const n=$('#i-q');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
  const x=$('#i-reload');if(x)x.onclick=()=>{if(S.ivDirty){toast('저장하지 않은 면접 점수가 있습니다. 먼저 저장해 주세요.');return}loadApps()};
  el.querySelectorAll('.arow').forEach(b=>b.onclick=()=>{if(S.ivDirty&&S.sel!==b.dataset.id){toast('저장하지 않은 면접 점수가 있습니다. 먼저 저장해 주세요.');return}S.sel=b.dataset.id;S.elig=null;S.iv=null;S.ivDirty=false;renderInbox()});
  el.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{S.dtab=b.dataset.dt;renderInbox()});
  const a=S.sel&&S.apps[S.sel];if(!a)return;
  if(S.dtab==='elig'){
    el.querySelectorAll('input[name=e-st]').forEach(r=>r.onchange=e=>{S.elig.status=e.target.value;renderInbox()});
    el.querySelectorAll('input[name=e-kind]').forEach(r=>r.onchange=e=>{S.elig.kind=e.target.value});
    $('#e-note').oninput=e=>{S.elig.note=e.target.value};
    $('#e-save').onclick=async()=>{const e=S.elig;const b=$('#e-save');b.disabled=true;
      const kind=(e.status==='부적격'||e.status==='보완 요청')?e.kind:'';try{await run('adminSaveElig',a.id,e.status,kind,e.note);a.status=e.status;a.elig={kind,note:e.note};toast('판정을 저장했습니다.');S.elig=null;renderInbox()}
      catch(err){toast('저장하지 못했습니다. '+err.message);b.disabled=false}};
  }
  if(S.dtab==='iv'){
    const dirty=()=>{S.ivDirty=true;const b=$('#v-save');if(b){b.disabled=false;b.nextElementSibling.textContent='저장하지 않은 점수가 있습니다'}};
    $('#v-who').oninput=e=>{S.iv.interviewer=e.target.value;dirty()};
    $('#v-date').onchange=e=>{S.iv.date=e.target.value;dirty()};
    el.querySelectorAll('.iq').forEach(box=>{const qid=box.dataset.q;
      box.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{const v=b.dataset.sc==='na'?'na':+b.dataset.sc;
        S.iv.scores[qid]=S.iv.scores[qid]===v?null:v;if(S.iv.scores[qid]==null)delete S.iv.scores[qid];S.ivDirty=true;
        const y=window.scrollY;renderInbox();window.scrollTo(0,y)});
      box.querySelector('[data-note]').oninput=e=>{S.iv.notes=S.iv.notes||{};S.iv.notes[qid]=e.target.value;dirty()};
    });
    $('#v-save').onclick=async()=>{const b=$('#v-save');b.disabled=true;const iv=clone(S.iv);delete iv.id;iv.savedAt=Date.now();
      const p=cur();const sc=calcScore({...a,interview:iv},p);
      const parts={};(sc.kind==='loan'?sc.groups:sc.areas).forEach(x=>parts[x.name]=x.val==null?null:Math.round(x.val*10)/10);
      try{await run('adminSaveInterview',a.id,iv,sc.started?sc.total:null,parts);a.interview=iv;S.ivDirty=false;toast('면접 기록을 저장했습니다.');renderInbox()}
      catch(err){toast('저장하지 못했습니다. '+err.message);b.disabled=false}};
  }
}
/* 엑셀 */
window.addEventListener('beforeunload',e=>{if(S.draftDirty||S.ivDirty){e.preventDefault();e.returnValue=''}});
boot();
</script>
