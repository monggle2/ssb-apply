<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신청·면접 시스템 담당자 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>

/* Layout: 상단 탭 3개(설계·신청·접수함) + 사업 선택. 설계는 2단(목록|요약), 접수함은 목록|상세 2단. 서류 양식 같은 정돈된 업무 화면 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#eef1f0; --ink:#17221f; --muted:#5b6a66; --line:#d8dfdc; --line2:#bfc9c5;
  --accent:#0f5c55; --accent-ink:#ffffff; --accent-soft:#e1efec;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#a3322a; --bad-soft:#f9e6e4; --info:#2b5a8a; --info-soft:#e5eef8;
  --display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --sunk:#141c19; --ink:#e6eeeb; --muted:#9db0aa; --line:#2b3834; --line2:#3a4a45;
  --accent:#5fc2b4; --accent-ink:#0c1715; --accent-soft:#1d3531;
  --ok:#6fd08f; --ok-soft:#173022; --warn:#e7b85a; --warn-soft:#33280f; --bad:#f08b80; --bad-soft:#3a1c19; --info:#8fb8e6; --info-soft:#1b2a3a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --sunk:#141c19; --ink:#e6eeeb; --muted:#9db0aa; --line:#2b3834; --line2:#3a4a45;
  --accent:#5fc2b4; --accent-ink:#0c1715; --accent-soft:#1d3531;
  --ok:#6fd08f; --ok-soft:#173022; --warn:#e7b85a; --warn-soft:#33280f; --bad:#f08b80; --bad-soft:#3a1c19; --info:#8fb8e6; --info-soft:#1b2a3a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto}
.brand h1{font-size:18px}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.progpick{display:flex;align-items:center;gap:8px}
.progpick label{font-size:13px;color:var(--muted)}
select,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=url],textarea{
  background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px}
select{width:auto;max-width:100%}
.progpick select{min-width:220px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 8px}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{font-size:13.5px;padding:9px 12px;border-radius:6px;background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
main{padding:20px 0 60px}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sm{font-size:13px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sechead{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.sechead h3{font-size:16px}
.sechead .code{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px}
.field>label,.flabel{font-weight:500;font-size:14px}
.req{color:var(--bad);margin-left:3px}
.help{font-size:12.5px;color:var(--muted)}
/* designer */
.ditem{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ditem.off{background:var(--sunk)}
.ditem.off .dname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px}
.dname{font-weight:500}
.dtype{font-size:12.5px;color:var(--muted)}
.dedit{border-top:1px dashed var(--line);padding:12px;display:grid;gap:10px;background:var(--sunk);border-radius:0 0 8px 8px}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.switch input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.fgrid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 10px;align-items:center}
.fgrid .k{font-size:12.5px;color:var(--muted)}
.qtext{font-size:14px}
.anc{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.anc li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:13.5px}
.anc b{font-variant-numeric:tabular-nums}
.summary dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;margin:0}
.summary dt{color:var(--muted);font-size:13.5px}
.summary dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
/* applicant form */
.form{max-width:780px;margin:0 auto;display:grid;gap:18px}
.fsec{display:grid;gap:16px}
.fitem{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.fitem:first-of-type{border-top:0}
.fitem h4{font-size:15px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.choices{display:flex;flex-wrap:wrap;gap:6px 14px}
.choices label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.choices input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.unit{display:flex;align-items:center;gap:6px}
.unit span{font-size:13px;color:var(--muted);white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scale td{white-space:nowrap}
.scale td:first-child{white-space:normal}
.err{color:var(--bad);font-size:12.5px}
.fitem.invalid{border-left:3px solid var(--bad);padding-left:10px}
.filelist{display:flex;flex-wrap:wrap;gap:6px}
.done{text-align:center;padding:40px 20px;display:grid;gap:10px;justify-items:center}
.done .no{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
/* inbox */
.inbox{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.alist{display:grid;gap:0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;border-left:3px solid transparent;width:100%;border-top:0;border-right:0}
.arow:hover{background:var(--sunk)}
.arow[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.arow .t{font-weight:600}
.arow .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.arow .r{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.score{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv>div{padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv .k{background:var(--sunk);color:var(--muted);font-size:13px}
.kv .g{grid-column:1/-1;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;text-decoration:none;background:var(--surface)}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.dtabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.iq{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.iq.na{background:var(--sunk)}
.iqh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iqh .no{font-family:var(--display);font-weight:700;color:var(--accent)}
.probe{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.scorebtns{display:flex;gap:4px;flex-wrap:wrap}
.scorebtns button{min-width:40px;padding:6px 0;border:1px solid var(--line2);background:var(--surface);border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.scorebtns button.na{min-width:72px;font-weight:500;font-size:13px}
.scorebtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.areabar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13.5px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.total .score{font-size:26px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
.toast[hidden]{display:none}
@media (max-width:900px){
  .grid2,.inbox{grid-template-columns:1fr}
  .sticky{position:static}
  .kv{grid-template-columns:1fr}
  .kv .k{border-bottom:0}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .dhead{grid-template-columns:auto minmax(0,1fr);}
  .dhead .dtype{grid-column:2}
  .fgrid{grid-template-columns:1fr}
  .progpick select{min-width:0;width:100%}
  .progpick{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.linkbox{display:flex;gap:6px;align-items:center}.linkbox input{flex:1;min-width:0;font-size:13px}
.toplinks{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}.toplinks a{color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.plist{display:grid;gap:10px}.pcard{display:block;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.pcard:hover{border-color:var(--accent)}
.term{display:grid;gap:6px}.tbody{max-height:170px;overflow:auto;white-space:pre-line;font-size:13px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.allagree{font-weight:700;border-top:1px solid var(--line);padding-top:10px}

</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand"><h1>신청·면접 시스템 · 담당자</h1><span>내부 시연·테스트용 · 실제 신청자 정보는 넣지 마세요</span></div>
    <div class="tabs" role="tablist" aria-label="화면">
      <button role="tab" id="tab-design" aria-selected="true" data-view="design">설계</button>
      <button role="tab" id="tab-inbox" aria-selected="false" data-view="inbox">접수함</button>
    </div>
    <div class="progpick">
      <label for="prog">사업</label>
      <select id="prog"></select>
    </div>
  </div>
  <div class="wrap"><div class="toplinks" id="toplinks" style="padding:0 0 10px"></div></div>
</header>
<main class="wrap">
  <div id="conn" class="notice" style="margin-bottom:14px">불러오는 중입니다.</div>
  <section class="view" id="view-design" aria-labelledby="tab-design"></section>
  <section class="view" id="view-inbox" aria-labelledby="tab-inbox" hidden></section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
